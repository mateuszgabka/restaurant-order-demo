<main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-1 gap-6">
  <div class="lg:col-span-2 space-y-6">
    <button (click)="router.navigate([''])" type="submit"
      class=" bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-2 px-4 rounded-xl transition shadow-lg text-center text-sm disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:bg-amber-500 disabled:shadow-none">
      🡐 Go back
    </button>
  </div>
  <div class="lg:col-span-2 space-y-6">
    <app-order [checkout]="true"></app-order>
  </div>
  <div
    class="lg:col-span-2 space-y-6 p-4 sm:p-6 lg:p-8 bg-slate-900 text-slate-100 rounded-2xl shadow-xl border border-slate-800 my-8">
    <h2 class="text-2xl font-bold mb-6 text-amber-500">Order details</h2>

    <form [formGroup]="checkoutForm" (ngSubmit)="onSubmit()" class="space-y-8">

      <div formGroupName="customer" class="space-y-4">
        <h3 class="text-lg font-semibold text-slate-200 border-b border-slate-800 pb-2">1. Contact details</h3>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium mb-1 text-slate-300">Name *</label>
            <input type="text" formControlName="firstName" placeholder="John"
              class="w-full bg-slate-800 border rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-amber-500 transition"
              [ngClass]="isFieldInvalid('customer', 'firstName') ? 'border-red-500' : 'border-slate-700'" />
            <p *ngIf="isFieldInvalid('customer', 'firstName')" class="text-red-400 text-xs mt-1">Name is required.</p>
          </div>

          <div>
            <label class="block text-sm font-medium mb-1 text-slate-300">Surname *</label>
            <input type="text" formControlName="lastName" placeholder="Doe"
              class="w-full bg-slate-800 border rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-amber-500 transition"
              [ngClass]="isFieldInvalid('customer', 'lastName') ? 'border-red-500' : 'border-slate-700'" />
            <p *ngIf="isFieldInvalid('customer', 'lastName')" class="text-red-400 text-xs mt-1">Surname is required.</p>
          </div>

          <!-- E-mail -->
          <div>
            <label class="block text-sm font-medium mb-1 text-slate-300">E-mail *</label>
            <input type="email" formControlName="email" placeholder="john.doe@example.com"
              class="w-full bg-slate-800 border rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-amber-500 transition"
              [ngClass]="isFieldInvalid('customer', 'email') ? 'border-red-500' : 'border-slate-700'" />
            <p *ngIf="isFieldInvalid('customer', 'email')" class="text-red-400 text-xs mt-1">E-mail is not valid.</p>
          </div>

          <!-- Telefon -->
          <div>
            <label class="block text-sm font-medium mb-1 text-slate-300">Phone number *</label>
            <input type="tel" formControlName="phone" placeholder="123456789"
              class="w-full bg-slate-800 border rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-amber-500 transition"
              [ngClass]="isFieldInvalid('customer', 'phone') ? 'border-red-500' : 'border-slate-700'" />
            <p *ngIf="isFieldInvalid('customer', 'phone')" class="text-red-400 text-xs mt-1">Phone is not valid.</p>
          </div>
        </div>
      </div>

      <!-- SEKCJA: ADRES DOSTAWY -->
      <div formGroupName="address" class="space-y-4">
        <h3 class="text-lg font-semibold text-slate-200 border-b border-slate-800 pb-2">2. Delivery adress</h3>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <!-- Ulica -->
          <div class="sm:col-span-2">
            <label class="block text-sm font-medium mb-1 text-slate-300">Street *</label>
            <input type="text" formControlName="street" placeholder="Main street"
              class="w-full bg-slate-800 border rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-amber-500 transition"
              [ngClass]="isFieldInvalid('address', 'street') ? 'border-red-500' : 'border-slate-700'" />
          </div>

          <!-- Nr domu / mieszkania -->
          <div>
            <label class="block text-sm font-medium mb-1 text-slate-300">Building number *</label>
            <input type="text" formControlName="buildingNumber" placeholder="12/4"
              class="w-full bg-slate-800 border rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-amber-500 transition"
              [ngClass]="isFieldInvalid('address', 'buildingNumber') ? 'border-red-500' : 'border-slate-700'" />
          </div>

          <!-- Kod pocztowy -->
          <div>
            <label class="block text-sm font-medium mb-1 text-slate-300">ZIP Code *</label>
            <input type="text" formControlName="zipCode" placeholder="00-000"
              class="w-full bg-slate-800 border rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-amber-500 transition"
              [ngClass]="isFieldInvalid('address', 'zipCode') ? 'border-red-500' : 'border-slate-700'" />
            <p *ngIf="isFieldInvalid('address', 'zipCode')" class="text-red-400 text-xs mt-1">00-000</p>
          </div>

          <!-- Miasto -->
          <div class="sm:col-span-2">
            <label class="block text-sm font-medium mb-1 text-slate-300">Town *</label>
            <input type="text" formControlName="city" placeholder="Warsaw"
              class="w-full bg-slate-800 border rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-amber-500 transition"
              [ngClass]="isFieldInvalid('address', 'city') ? 'border-red-500' : 'border-slate-700'" />
          </div>
        </div>
      </div>

      <div class="space-y-4">
        <h3 class="text-lg font-semibold text-slate-200 border-b border-slate-800 pb-2">3. Payment method</h3>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <!-- <label class="flex items-center gap-3 p-3 bg-slate-800 border border-slate-700 rounded-xl cursor-pointer hover:border-amber-500 transition">
          <input type="radio" formControlName="paymentMethod" value="card" class="accent-amber-500 w-4 h-4" />
          <span class="text-sm font-medium">Card</span>
        </label>

        <label class="flex items-center gap-3 p-3 bg-slate-800 border border-slate-700 rounded-xl cursor-pointer hover:border-amber-500 transition">
          <input type="radio" formControlName="paymentMethod" value="blik" class="accent-amber-500 w-4 h-4" />
          <span class="text-sm font-medium">BLIK</span>
        </label> -->

          <label
            class="flex items-center gap-3 p-3 bg-slate-800 border border-slate-700 rounded-xl cursor-pointer hover:border-amber-500 transition">
            <input type="radio" formControlName="paymentMethod" value="cash" class="accent-amber-500 w-4 h-4" />
            <span class="text-sm font-medium">Cash (payment on delivery)</span>
          </label>
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium mb-1 text-slate-300">Order notes (optional)</label>
        <textarea formControlName="notes" rows="3" placeholder="e.g. Intercom code: 1234, enter from the back"
          class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-amber-500 transition"></textarea>
      </div>

      <button type="submit"
        class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3.5 px-4 rounded-xl transition shadow-lg text-center text-sm disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:bg-amber-500 disabled:shadow-none"
        [disabled]="checkoutForm.invalid || orderService?.getTotalAmount() === 0">
        Place an order
      </button>

    </form>
  </div>
</main>
