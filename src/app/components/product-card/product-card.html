<article
    class="bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-col justify-between hover:border-slate-700 transition shadow-sm">
    <div>
        <div class="flex justify-between items-start mb-2">
            <h3 class="font-bold text-lg text-white">{{ product?.name }}</h3>
            <span class="font-bold text-amber-400">{{ product?.price | currency: 'USD' }}</span>
        </div>
        <p class="text-xs text-slate-400 leading-relaxed mb-4">
            {{ product?.description }}
        </p>
    </div>

    <button (click)="addToOrder(product?.id)"
        class="w-full bg-slate-800 hover:bg-amber-500 hover:text-slate-950 text-slate-200 font-semibold py-2 px-4 rounded-lg transition flex items-center justify-center gap-2 text-sm">
        <span>+ Add to order</span>
    </button>
</article>
