<nav class="flex gap-2 overflow-x-auto pb-2 scrollbar-none">
   @if (isReady()) {
        @for (item of categoriesService.categories(); track item.id) {
            <button (click)="select(item.id)" [ngClass]="selectedCat == item.id ? 'bg-amber-500 text-slate-950 font-semibold' : 'bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium'"
                class="px-4 py-2 rounded-full text-sm transition whitespace-nowrap">
                {{ item.name }}
            </button>
        }
    }
</nav>
