<div *ngIf="showStatus" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4">
    <div class="bg-slate-800 rounded-xl p-6 w-full max-w-md shadow-xl">
        <h3 class="text-xl font-bold text-slate-100 mb-4">{{ this.id ? 'Edit' : 'Add New' }} Category</h3>
        
        <form #productForm="ngForm" (ngSubmit)="onSaveCategory()" class="space-y-4">

            <div>
                <label for="name" class="block text-sm font-medium text-slate-300 mb-1">Category</label>
                <strong>{{ currentCategoryName() }}</strong>
            </div>
            <div>
                <label for="name" class="block text-sm font-medium text-slate-300 mb-1">Name</label>
                <input type="text" id="name" name="name" [(ngModel)]="category().name"
                    class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg focus:outline-none focus:border-amber-500 user-invalid:border-red-500/50"
                    required>
            </div>
            <div class="flex justify-end space-x-3">
                <button type="button" (click)="close()"
                    class="px-4 py-2 text-sm bg-slate-600 hover:bg-slate-500 rounded-lg transition">Cancel</button>
                
                <button type="submit"
                    [disabled]="!productForm.form.valid"
                    class="px-4 py-2 text-sm bg-emerald-600 hover:bg-emerald-500 disabled:bg-slate-700 disabled:text-slate-500 disabled:cursor-not-allowed text-white rounded-lg transition shadow-lg shadow-emerald-600/20">
                    {{ this.id ? 'Edit' : 'Add' }} Category
                </button>
            </div>
        </form>
    </div>
</div>
