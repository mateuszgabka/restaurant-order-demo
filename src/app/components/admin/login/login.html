<div class="my-20 bg-slate-950 flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl shadow-xl p-8">

        <button (click)="router.navigate([''])" type="submit"
        class=" bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-2 px-4 rounded-xl transition shadow-lg text-center text-sm disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:bg-amber-500 disabled:shadow-none">
        🡐 Go back
        </button>
        <div class="text-center mb-8">
            <div
                class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-amber-500/10 text-amber-500 mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor" class="w-6 h-6">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-slate-100">Admin Dashboard</h1>
            <p class="text-slate-400 text-sm mt-1">Type password to admin access</p>
        </div>

        <form (ngSubmit)="onSubmit()" class="space-y-6">
            <div>
                <label for="password" class="block text-sm font-medium text-slate-300 mb-2">
                    Password
                </label>
                <input id="password" type="password" [(ngModel)]="password" name="password" required
                    placeholder="••••••••" [disabled]="isLoading()"
                    class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-amber-500/50 focus:border-amber-500 transition disabled:opacity-50" />
            </div>

            @if (errorMessage()) {
            <div
                class="p-3 bg-red-500/10 border border-red-500/20 rounded-xl text-red-400 text-sm flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor" class="w-5 h-5 flex-shrink-0">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z" />
                </svg>
                <span>{{ errorMessage() }}</span>
            </div>
            }

            <button type="submit" [disabled]="isLoading() || !password().trim()"
                class="w-full py-3 px-4 bg-amber-500 hover:bg-amber-400 active:bg-amber-600 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:bg-amber-500 disabled:shadow-none font-semibold text-slate-950 rounded-xl transition flex items-center justify-center gap-2">
                @if (isLoading()) {
                <svg class="animate-spin h-5 w-5 text-slate-950" xmlns="http://www.w3.org/2000/svg" fill="none"
                    viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor"
                        d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                    </path>
                </svg>
                <span>Loading...</span>
                } @else {
                <span>Login</span>
                }
            </button>
        </form>

        <!-- Wskazówka testowa dla rekrutera / Ciebie -->
        <div class="mt-6 text-center">
            <p class="text-xs text-slate-500">
                password for test: <code
                    class="bg-slate-800 text-amber-400 px-1.5 py-0.5 rounded border border-slate-700">admin123</code>
            </p>
        </div>

    </div>
</div>
