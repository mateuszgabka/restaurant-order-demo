<div *ngIf="product" 
    class="flex items-center justify-between p-4 bg-slate-800/50 border border-slate-700/60 rounded-xl hover:border-slate-600 transition group">
    <div class="flex items-center gap-4">
        <div class="text-slate-600 group-hover:text-slate-400 cursor-grab active:cursor-grabbing transition">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
            </svg>
        </div>
        <div>
            <h4 class="font-bold text-slate-200 text-sm">{{ product.name }}</h4>
            <p class="text-xs text-slate-400 line-clamp-1">{{ product.description }}</p>
        </div>
    </div>
    <div class="flex items-center gap-6">
        <span class="font-semibold text-amber-400 text-sm">{{ product.price | currency: 'USD'}}</span>
        <div class="flex items-center gap-2">
            <button (click)="showEditProduct = true"
                class="p-2 text-slate-400 hover:text-amber-400 hover:bg-slate-700/50 rounded-lg transition"
                title="Edytuj">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor" class="w-4 h-4">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0115.75 21H5.25A2.25 2.25 0 013 18.75V8.25A2.25 2.25 0 015.25 6H10" />
                </svg>
            </button>
            <button (click)="deleteProduct(product.id)"
                class="p-2 text-slate-400 hover:text-red-400 hover:bg-slate-700/50 rounded-lg transition" title="Usuń">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor" class="w-4 h-4">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" />
                </svg>
            </button>
        </div>
    </div>
</div>

<app-admin-product-edit  (cancelProduct)="onProductCancel($event)"  [showStatus]="showEditProduct"  [category]="product?.categoryId ?? 0" [id]="product?.id">
</app-admin-product-edit>
