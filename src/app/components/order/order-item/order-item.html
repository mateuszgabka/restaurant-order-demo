<div class="flex items-center justify-between text-sm order-item">
    <div>
        <p class="font-medium text-slate-200 product-name">{{ getProductName(item.productId) }}
            <span (click)="removeItem(item.productId)">
                <svg class="fill-slate-500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
                    <!--!Font Awesome Free v7.3.1 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.-->
                    <path
                        d="M232.7 69.9L224 96L128 96C110.3 96 96 110.3 96 128C96 145.7 110.3 160 128 160L512 160C529.7 160 544 145.7 544 128C544 110.3 529.7 96 512 96L416 96L407.3 69.9C402.9 56.8 390.7 48 376.9 48L263.1 48C249.3 48 237.1 56.8 232.7 69.9zM512 208L128 208L149.1 531.1C150.7 556.4 171.7 576 197 576L443 576C468.3 576 489.3 556.4 490.9 531.1L512 208z" />
                </svg>
            </span>
        </p>
        <p class="text-xs text-slate-500">{{ item.quantity }}x {{ getProductPrice(item.productId) | currency: 'USD' }}
        </p>
    </div>
    <div class="flex items-center gap-2">
        <button (click)="(item.quantity > 1) ? (item.quantity = item.quantity - 1) : ''"
            class="w-6 h-6 rounded bg-slate-800 text-slate-300 flex items-center justify-center hover:bg-slate-700 text-xs">-</button>
        <span class="text-xs font-semibold">{{ item.quantity }}</span>
        <button (click)="item.quantity = item.quantity + 1"
            class="w-6 h-6 rounded bg-slate-800 text-slate-300 flex items-center justify-center hover:bg-slate-700 text-xs">+</button>
    </div>
</div>
