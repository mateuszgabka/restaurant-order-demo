<aside *ngIf="orderService.order()"
    class="bg-slate-900 border border-slate-800 rounded-xl p-5 flex flex-col justify-between h-fit sticky top-24 shadow-xl">
    <div>
        <div class="flex items-center justify-between border-b border-slate-800 pb-3 mb-4">
            <h2 class="font-bold text-lg text-white flex items-center gap-2 cart-title">
                <span>
                    <svg class="fill-amber-500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
                        <!--!Font Awesome Free v7.3.1 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.-->
                        <path
                        d="M24 48C10.7 48 0 58.7 0 72C0 85.3 10.7 96 24 96L69.3 96C73.2 96 76.5 98.8 77.2 102.6L129.3 388.9C135.5 423.1 165.3 448 200.1 448L456 448C469.3 448 480 437.3 480 424C480 410.7 469.3 400 456 400L200.1 400C188.5 400 178.6 391.7 176.5 380.3L171.4 352L475 352C505.8 352 532.2 330.1 537.9 299.8L568.9 133.9C572.6 114.2 557.5 96 537.4 96L124.7 96L124.3 94C119.5 67.4 96.3 48 69.2 48L24 48zM208 576C234.5 576 256 554.5 256 528C256 501.5 234.5 480 208 480C181.5 480 160 501.5 160 528C160 554.5 181.5 576 208 576zM432 576C458.5 576 480 554.5 480 528C480 501.5 458.5 480 432 480C405.5 480 384 501.5 384 528C384 554.5 405.5 576 432 576z"/>
                    </svg>
                </span> 
                Your order
            </h2>
            <span class="text-xs bg-slate-800 text-slate-400 px-2.5 py-1 rounded-full">{{ orderService.order()?.items?.length }} Item(s)</span>
        </div>

        <!-- Pozycje w koszyku -->
        <div class="space-y-3 mb-6">
            @if((this.order().items?.length ?? 0) > 0) {
                @for (item of this.order().items; track item) {
                    <app-order-item [item]="item"></app-order-item>
                    
                }
            }
            @else {
                <div class="flex items-center justify-center text-sm">
                    <p class="text-xs text-slate-500 m-2">
                        Add dish to order
                    </p>
                </div>
            }
        </div>
    </div>

    <div class="border-t border-slate-800 pt-4 space-y-3">
        <div class="flex justify-between items-center text-sm">
            <span class="text-slate-400">Total amount:</span>
            <span class="text-xl font-extrabold text-amber-400">{{ orderService.getTotalAmount() | currency: 'USD' }}</span>
        </div>
        @if (!checkout) {
            <button (click)="router.navigate(['/checkout'])"
            class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 px-4 rounded-xl transition shadow-lg text-center text-sm disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:bg-amber-500 disabled:shadow-none" 
                [disabled]="(orderService.order()?.items?.length ?? 0) === 0">
                Continue Order
            </button>
        }
    </div>
</aside>
