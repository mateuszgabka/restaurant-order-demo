<main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        <section class="lg:col-span-2 space-y-6">
            <app-cat-nav (categorySelected)="onCategoryChange($event)"></app-cat-nav>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                @if (!isReady()) {
                    <div class="flex w-full col-span-full items-center justify-center my-8 text-slate-400 text-sm gap-3">
                        <svg class="animate-spin h-5 w-5 text-amber-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        
                        <span class="font-medium tracking-wide">Loading...</span>
                    </div>
                }
                @if (isReady()) {
                    @for (item of productService.products(); track item.id) {
                        <app-product-card *ngIf="!selectedCategoryId() || selectedCategoryId() === item.categoryId" [product]="item"></app-product-card>
                    }
                }
            </div>
        </section>
        <app-order></app-order>
</main>
